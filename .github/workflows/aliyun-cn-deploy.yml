name: Deploy China Edition to Aliyun ECS

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed china-edition commit
        required: true
        type: string
      preflight_only:
        description: Inspect current release without uploading or activating pages
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: aliyun-cn-production
  cancel-in-progress: false

jobs:
  deploy-cn:
    name: Build and deploy China edition
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deployment ref
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "china-edition" ] || [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Aliyun China production deploy must run from china-edition. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check CN API and D1 readiness
        if: ${{ !inputs.preflight_only }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx wrangler d1 execute sagemro-db-cn --env production --remote \
            --command "SELECT version FROM _migrations ORDER BY version;" \
            > /tmp/sagemro-d1-migrations-cn.txt

          APPLIED_CN=$(grep -Eo '[0-9]{3}[a-z]?_[A-Za-z0-9_]+' /tmp/sagemro-d1-migrations-cn.txt | sort -u || true)
          CN_REQUIRED="047_structured_service_request_intake 048_service_request_assist_quota 050_engineer_service_profiles 051_business_scope 052_business_quote_costs 053_business_receipt_actors 054_business_execution_assignments 055_business_service_execution"
          for ver in $CN_REQUIRED; do
            if ! echo "$APPLIED_CN" | grep -q "^${ver}$"; then
              echo "::error::CN production D1 migration is missing: ${ver}"
              exit 1
            fi
          done

          assist_status=$(curl -sS -o /tmp/service-request-assist-readiness.json -w '%{http_code}' \
            -X POST https://api.sagemro.cn/api/service-request-assist \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://ai.sagemro.cn' \
            --data '{}')
          if [ "$assist_status" != "400" ]; then
            echo "::error::CN API does not expose the expected service-request assist contract (HTTP ${assist_status})."
            exit 1
          fi

      - name: Validate Aliyun deploy secrets
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_PORT: ${{ secrets.ALIYUN_ECS_PORT }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
          ALIYUN_ECS_SSH_KEY: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION_ID: ${{ secrets.ALIYUN_REGION_ID }}
          ALIYUN_SECURITY_GROUP_ID: ${{ secrets.ALIYUN_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in ALIYUN_ECS_HOST ALIYUN_ECS_PORT ALIYUN_ECS_USER ALIYUN_ECS_SSH_KEY ALIYUN_ACCESS_KEY_ID ALIYUN_ACCESS_KEY_SECRET ALIYUN_REGION_ID ALIYUN_SECURITY_GROUP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build frontend
        if: ${{ !inputs.preflight_only }}
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test --if-present
          npm run build:public
          npm run build:portal

      - name: Build admin
        if: ${{ !inputs.preflight_only }}
        working-directory: admin
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test --if-present
          npm run build

      - name: Package release
        if: ${{ !inputs.preflight_only }}
        run: |
          set -euo pipefail
          RELEASE_ID="${GITHUB_SHA:0:12}-${GITHUB_RUN_NUMBER}"
          PACKAGE_NAME="sagemro-cn-release-${RELEASE_ID}.tgz"

          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

          mkdir -p release/frontend release/ai release/admin
          cp -a frontend/dist/. release/frontend/
          cp -a frontend/dist-portal/. release/ai/
          cp -a admin/dist/. release/admin/
          tar -czf "$PACKAGE_NAME" -C release .

          test -f release/frontend/index.html
          test -f release/ai/index.html
          test -f release/admin/index.html

      - name: Setup Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1

      - name: Detect GitHub runner IP
        run: |
          set -euo pipefail
          runner_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          if ! [[ "$runner_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unable to detect a valid IPv4 runner IP: ${runner_ip}"
            exit 1
          fi

          echo "::add-mask::${runner_ip}"
          echo "RUNNER_CIDR=${runner_ip}/32" >> "$GITHUB_ENV"

      - name: Allow GitHub runner SSH
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION_ID: ${{ secrets.ALIYUN_REGION_ID }}
          ALIYUN_SECURITY_GROUP_ID: ${{ secrets.ALIYUN_SECURITY_GROUP_ID }}
          ALIYUN_ECS_PORT: ${{ secrets.ALIYUN_ECS_PORT }}
        run: |
          set -euo pipefail
          aliyun configure set \
            --profile sagemro-ci \
            --mode AK \
            --region "$ALIYUN_REGION_ID" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"

          aliyun ecs RevokeSecurityGroup \
            --profile sagemro-ci \
            --RegionId "$ALIYUN_REGION_ID" \
            --SecurityGroupId "$ALIYUN_SECURITY_GROUP_ID" \
            --IpProtocol tcp \
            --PortRange "$ALIYUN_ECS_PORT/$ALIYUN_ECS_PORT" \
            --SourceCidrIp "$RUNNER_CIDR" >/dev/null 2>&1 || true

          aliyun ecs AuthorizeSecurityGroup \
            --profile sagemro-ci \
            --RegionId "$ALIYUN_REGION_ID" \
            --SecurityGroupId "$ALIYUN_SECURITY_GROUP_ID" \
            --IpProtocol tcp \
            --PortRange "$ALIYUN_ECS_PORT/$ALIYUN_ECS_PORT" \
            --SourceCidrIp "$RUNNER_CIDR" \
            --Policy accept \
            --Priority 1

          echo "RUNNER_SSH_RULE_ADDED=true" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_PORT: ${{ secrets.ALIYUN_ECS_PORT }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
          ALIYUN_ECS_SSH_KEY: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
          ALIYUN_ECS_HOST_KEY: ${{ secrets.ALIYUN_ECS_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ALIYUN_ECS_SSH_KEY" > ~/.ssh/aliyun_ecs
          chmod 600 ~/.ssh/aliyun_ecs
          : > ~/.ssh/known_hosts
          if [ -n "${ALIYUN_ECS_HOST_KEY:-}" ]; then
            printf '%s\n' "$ALIYUN_ECS_HOST_KEY" >> ~/.ssh/known_hosts
          else
            set +e
            ssh -p "$ALIYUN_ECS_PORT" \
              -o BatchMode=yes \
              -o PreferredAuthentications=none \
              -o StrictHostKeyChecking=accept-new \
              "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST" true
            ssh_status=$?
            set -e

            if [ ! -s ~/.ssh/known_hosts ]; then
              echo "::error::Unable to record Aliyun ECS host key. SSH exited with ${ssh_status}."
              exit 1
            fi
          fi

      - name: Inspect current release and unchanged Nginx
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_PORT: ${{ secrets.ALIYUN_ECS_PORT }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          set -euo pipefail
          current_state=$(ssh -i ~/.ssh/aliyun_ecs -p "$ALIYUN_ECS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST" "bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
          $SUDO nginx -t
          nginx_config="$($SUDO nginx -T 2>/dev/null)"
          expected_upstream=$(cat <<'NGINX'
          upstream sagemro_api_worker {
            server api.sagemro.com:443;
            keepalive 32;
          }
          NGINX
          )
          normalized_upstream="$(printf '%s' "$expected_upstream" | tr -s '[:space:]' ' ')"
          printf '%s' "$nginx_config" | tr -s '[:space:]' ' ' | grep -F "$normalized_upstream" >/dev/null
          printf 'CURRENT_NGINX_SHA=%s\n' "$(printf '%s' "$nginx_config" | sha256sum | cut -d' ' -f1)"
          for site in frontend engineer ai admin; do
            link_path="/var/www/sagemro-cn/current/$site"
            if ! $SUDO test -L "$link_path"; then
              echo "Existing release link is missing or not a symlink: $site" >&2
              exit 1
            fi
            target="$(readlink -f "$link_path")"
            case "$target" in /var/www/sagemro-cn/releases/*) ;; *) exit 1 ;; esac
            $SUDO test -f "$target/index.html"
            printf 'PREVIOUS_%s=%s\n' "$site" "$target"
          done
          REMOTE_SCRIPT
          )
          printf '%s\n' "$current_state" >> "$GITHUB_ENV"
          printf '%s\n' "$current_state"

      - name: Upload release
        if: ${{ !inputs.preflight_only }}
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_PORT: ${{ secrets.ALIYUN_ECS_PORT }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/aliyun_ecs -P "$ALIYUN_ECS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$PACKAGE_NAME" \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST:/tmp/$PACKAGE_NAME"

      - name: Activate release
        if: ${{ !inputs.preflight_only }}
        id: activate
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_PORT: ${{ secrets.ALIYUN_ECS_PORT }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aliyun_ecs -p "$ALIYUN_ECS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST" \
            "RELEASE_ID='$RELEASE_ID' PACKAGE_NAME='$PACKAGE_NAME' EXPECTED_NGINX_SHA='$CURRENT_NGINX_SHA' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          package="/tmp/${PACKAGE_NAME}"
          release="/var/www/sagemro-cn/releases/${RELEASE_ID}"
          current="/var/www/sagemro-cn/current"

          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo"
          fi

          if $SUDO test -e "$release"; then
            echo "Refusing to replace an existing release." >&2
            exit 1
          fi
          $SUDO mkdir -p "$release"
          $SUDO tar -xzf "$package" -C "$release"

          test -f "$release/frontend/index.html"
          test -f "$release/ai/index.html"
          test -f "$release/admin/index.html"

          backup_root="/var/backups/sagemro-pages"
          release_state="$backup_root/${RELEASE_ID}.release"
          $SUDO mkdir -p "$backup_root"
          capture_previous_target() {
            link_path="$1"
            if ! $SUDO test -L "$link_path"; then
              echo "Existing release link is missing or not a symlink." >&2
              exit 1
            fi
            target="$(readlink -f "$link_path")"
            case "$target" in /var/www/sagemro-cn/releases/*) ;; *) exit 1 ;; esac
            $SUDO test -f "$target/index.html"
            printf '%s' "$target"
          }
          previous_frontend="$(capture_previous_target "$current/frontend")"
          previous_engineer="$(capture_previous_target "$current/engineer")"
          previous_ai="$(capture_previous_target "$current/ai")"
          previous_admin="$(capture_previous_target "$current/admin")"
          printf '%s\n' "$previous_frontend" "$previous_engineer" "$previous_ai" "$previous_admin" | $SUDO tee "$release_state" >/dev/null
          printf 'Previous frontend: %s\nPrevious engineer: %s\nPrevious AI: %s\nPrevious admin: %s\n' "$previous_frontend" "$previous_engineer" "$previous_ai" "$previous_admin"
          $SUDO nginx -t
          actual_nginx_config="$($SUDO nginx -T 2>/dev/null)"
          actual_nginx_sha="$(printf '%s' "$actual_nginx_config" | sha256sum | cut -d' ' -f1)"
          if [ "$actual_nginx_sha" != "$EXPECTED_NGINX_SHA" ]; then
            echo "Nginx configuration changed during the pages-only release." >&2
            exit 1
          fi
          $SUDO ln -sfnT "$release/frontend" "$current/frontend"
          $SUDO ln -sfnT "$release/frontend" "$current/engineer"
          $SUDO ln -sfnT "$release/ai" "$current/ai"
          $SUDO ln -sfnT "$release/admin" "$current/admin"
          $SUDO systemctl reload nginx

          echo "Activated release: $release"
          REMOTE_SCRIPT

      - name: Health checks
        id: health
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 https://sagemro.cn/ >/dev/null
          portal_html=$(curl -fsS --retry 3 --retry-delay 2 'https://ai.sagemro.cn/service-request?mode=manual')
          echo "$portal_html" | grep -qi 'noindex,nofollow,noarchive'
          curl -fsS --retry 3 --retry-delay 2 https://admin.sagemro.cn/ >/dev/null
          curl -fsS --retry 3 --retry-delay 2 https://engineer.sagemro.cn/ >/dev/null
          curl -fsS --retry 3 --retry-delay 2 https://api.sagemro.cn/health >/dev/null
          curl -fsS --retry 3 --retry-delay 2 https://sagemro.cn/activate >/dev/null
          curl -fsS --retry 3 --retry-delay 2 https://engineer.sagemro.cn/work-orders/deploy-smoke >/dev/null

          expected_robots_tag='noindex, nofollow, noarchive, nosnippet, noimageindex'
          expect_robots_tag() {
            smoke_url="$1"
            if ! curl -fsSI --retry 3 --retry-delay 2 "$smoke_url" | tr -d '\r' | grep -Fqi "X-Robots-Tag: $expected_robots_tag"; then
              echo "::error::${smoke_url} is missing the required private-route X-Robots-Tag"
              exit 1
            fi
          }
          expect_no_robots_tag() {
            smoke_url="$1"
            if curl -fsSI --retry 3 --retry-delay 2 "$smoke_url" | tr -d '\r' | grep -Eqi '^X-Robots-Tag:.*noindex'; then
              echo "::error::${smoke_url} unexpectedly returns a noindex X-Robots-Tag"
              exit 1
            fi
          }

          expect_robots_tag https://admin.sagemro.cn/deploy-admin-smoke
          expect_robots_tag https://ai.sagemro.cn/
          expect_robots_tag https://sagemro.cn/activate
          expect_robots_tag https://engineer.sagemro.cn/work-orders/deploy-smoke
          expect_no_robots_tag https://engineer.sagemro.cn/

          admin_smoke_url=https://admin.sagemro.cn/deploy-admin-smoke
          admin_smoke_status="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$admin_smoke_url")"
          if [ "$admin_smoke_status" != "200" ]; then
            echo "::error::${admin_smoke_url} expected HTTP 200 but returned ${admin_smoke_status}"
            exit 1
          fi

          expect_404() {
            smoke_url="$1"
            smoke_status="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$smoke_url")"
            if [ "$smoke_status" != "404" ]; then
              echo "::error::${smoke_url} expected HTTP 404 but returned ${smoke_status}"
              exit 1
            fi
          }
          expect_404 https://sagemro.cn/deploy-404-smoke
          expect_404 https://engineer.sagemro.cn/deploy-404-smoke

          china_frontend_ip="$(getent ahostsv4 sagemro.cn | awk 'NR == 1 { print $1 }')"
          if [ -z "$china_frontend_ip" ]; then
            echo "::error::Unable to resolve the China frontend IPv4 address"
            exit 1
          fi
          set +e
          unknown_host_status="$(curl --insecure --silent --show-error --connect-timeout 10 --max-time 20 \
            --resolve "unexpected.invalid:443:${china_frontend_ip}" \
            --output /dev/null --write-out '%{http_code}' \
            https://unexpected.invalid/)"
          unknown_host_exit=$?
          set -e
          if [ "$unknown_host_exit" -eq 0 ] || [ "$unknown_host_status" != "000" ]; then
            echo "::error::China unknown host expected to be rejected; curl exit=${unknown_host_exit}, status=${unknown_host_status}"
            exit 1
          fi

          for site_host in sagemro.cn ai.sagemro.cn admin.sagemro.cn engineer.sagemro.cn; do
            site_url="https://${site_host}"
            http_version="$(curl -fsS --http2 -o /dev/null -w '%{http_version}' "$site_url/")"
            if [ "$http_version" != "2" ]; then
              echo "::error::${site_host} negotiated HTTP/$http_version instead of HTTP/2"
              exit 1
            fi

            root_headers="$(curl -fsS -D - -o /dev/null "$site_url/" | tr -d '\r')"
            grep -Eqi '^cache-control:.*no-cache' <<< "$root_headers" || {
              echo "::error::${site_host} HTML is missing the no-cache policy"
              exit 1
            }
            for header_name in content-security-policy strict-transport-security x-content-type-options x-frame-options referrer-policy permissions-policy; do
              grep -qi "^${header_name}:" <<< "$root_headers" || {
                echo "::error::${site_host} HTML is missing security header: ${header_name}"
                exit 1
              }
            done

            page_html="$(curl -fsS "$site_url/")"
            asset_path="$(sed -n 's/.*src="\([^"]*\/assets\/index-[^"]*\.js\)".*/\1/p' <<< "$page_html" | head -1)"
            if [ -z "$asset_path" ]; then
              echo "::error::Unable to locate the ${site_host} entry asset"
              exit 1
            fi

            asset_headers="$(curl --compressed -fsS -D - -o /dev/null "${site_url}${asset_path}" | tr -d '\r')"
            grep -qi '^content-encoding: gzip$' <<< "$asset_headers" || {
              echo "::error::${site_host} JavaScript is not gzip compressed"
              exit 1
            }

            asset_cache_control="$(grep -i '^cache-control:' <<< "$asset_headers" | sed 's/^[^:]*:[[:space:]]*//' | tr '[:upper:]' '[:lower:]' | tr '\n' ',')"
            public_found=false
            immutable_found=false
            max_age_count=0
            cache_conflict=false
            IFS=',' read -ra cache_directives <<< "$asset_cache_control"
            for cache_directive in "${cache_directives[@]}"; do
              cache_directive="$(xargs <<< "$cache_directive")"
              case "$cache_directive" in
                public) public_found=true ;;
                immutable) immutable_found=true ;;
                max-age=31536000) max_age_count=$((max_age_count + 1)) ;;
                max-age=*|s-maxage=*|private|no-cache|no-store) cache_conflict=true ;;
              esac
            done
            if [ "$public_found" != "true" ] || [ "$immutable_found" != "true" ] || [ "$max_age_count" -ne 1 ] || [ "$cache_conflict" = "true" ]; then
              echo "::error::${site_host} JavaScript has invalid cache directives: ${asset_cache_control}"
              exit 1
            fi
          done

      - name: Roll back failed China release
        if: ${{ always() && (steps.activate.outcome == 'failure' || steps.activate.outcome == 'cancelled' || steps.health.outcome == 'failure' || steps.health.outcome == 'cancelled') }}
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_PORT: ${{ secrets.ALIYUN_ECS_PORT }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aliyun_ecs -p "$ALIYUN_ECS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST" \
            "RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          current="/var/www/sagemro-cn/current"
          backup_root="/var/backups/sagemro-pages"
          release_state="$backup_root/${RELEASE_ID}.release"
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
          if ! $SUDO test -f "$release_state"; then
            echo "No activation state found; nothing to roll back."
            exit 0
          fi
          mapfile -t previous_releases < <($SUDO cat "$release_state")
          if [ "${#previous_releases[@]}" -ne 4 ]; then exit 1; fi
          for target in "${previous_releases[@]}"; do
            case "$target" in /var/www/sagemro-cn/releases/*) ;; *) exit 1 ;; esac
            $SUDO test -f "$target/index.html"
          done
          $SUDO ln -sfnT "${previous_releases[0]}" "$current/frontend"
          $SUDO ln -sfnT "${previous_releases[1]}" "$current/engineer"
          $SUDO ln -sfnT "${previous_releases[2]}" "$current/ai"
          $SUDO ln -sfnT "${previous_releases[3]}" "$current/admin"

          $SUDO nginx -t
          $SUDO systemctl reload nginx
          echo "Rolled back failed release: ${RELEASE_ID}"
          REMOTE_SCRIPT

      - name: Revoke GitHub runner SSH
        if: always()
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION_ID: ${{ secrets.ALIYUN_REGION_ID }}
          ALIYUN_SECURITY_GROUP_ID: ${{ secrets.ALIYUN_SECURITY_GROUP_ID }}
          ALIYUN_ECS_PORT: ${{ secrets.ALIYUN_ECS_PORT }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_SSH_RULE_ADDED:-}" != "true" ] || [ -z "${RUNNER_CIDR:-}" ]; then
            echo "No temporary runner SSH rule was recorded; skipping cleanup."
            exit 0
          fi

          aliyun configure set \
            --profile sagemro-ci \
            --mode AK \
            --region "$ALIYUN_REGION_ID" \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET"

          aliyun ecs RevokeSecurityGroup \
            --profile sagemro-ci \
            --RegionId "$ALIYUN_REGION_ID" \
            --SecurityGroupId "$ALIYUN_SECURITY_GROUP_ID" \
            --IpProtocol tcp \
            --PortRange "$ALIYUN_ECS_PORT/$ALIYUN_ECS_PORT" \
            --SourceCidrIp "$RUNNER_CIDR"

      - name: Deployment summary
        if: ${{ !inputs.preflight_only }}
        run: |
          {
            echo "### Aliyun China deploy"
            echo ""
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Frontend: https://sagemro.cn/"
