<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>联系我们 — SAGEMRO</title>
<meta name="robots" content="noindex,follow" />
<meta name="description" content="SAGEMRO 设备服务联系方式：设备故障、备件采购、上门服务与合作咨询，请通过电话、微信或邮箱联系我们。" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 56px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.7; color: #1f2937; background: #f7f7f8;
  }
  main { max-width: 640px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand strong { font-size: 17px; letter-spacing: .04em; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  .lead { margin: 0 0 28px; color: #4b5563; }
  .channels { display: grid; gap: 12px; margin: 0 0 28px; }
  .channel {
    display: block; padding: 16px 18px; border: 1px solid #e5e7eb; border-radius: 14px;
    background: #fff; text-decoration: none; color: inherit;
  }
  .channel:hover { border-color: #f59e0b; }
  .channel .k { font-size: 13px; color: #6b7280; }
  .channel .v { font-size: 17px; font-weight: 600; margin-top: 2px; word-break: break-all; }
  .placeholder { border-style: dashed; border-color: #f59e0b; background: #fffbeb; }
  .placeholder .v { color: #b45309; }
  .qr-slot {
    width: 150px; height: 150px; margin-top: 6px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff;
  }
  .qr-hint { margin-top: 6px; font-size: 13px; color: #6b7280; }
  .note { padding: 14px 16px; border-left: 3px solid #f59e0b; background: #fffbeb; color: #7c2d12; font-size: 14px; border-radius: 0 10px 10px 0; }
  footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #e5e7eb; font-size: 14px; color: #6b7280; display: flex; flex-wrap: wrap; gap: 12px; }
  a { color: #b45309; }
</style>
</head>
<body>
<main>
  <div class="brand"><strong>SAGEMRO</strong></div>

  <h1>联系我们</h1>
  <p class="lead">设备故障、备件采购、上门服务与合作咨询，请通过以下任一方式联系 SAGEMRO 团队。我们会尽快回复并安排后续处理。</p>

  <div class="channels">
    <a class="channel" href="tel:+8618615584520">
      <div class="k">电话</div>
      <div class="v">186 1558 4520</div>
    </a>
    <div class="channel">
      <div class="k">微信 · 扫码添加</div>
      <img class="qr-slot" src="/static/wechat-qr.png" alt="SAGEMRO 企业微信二维码" width="150" height="150" />
      <div class="qr-hint">扫描二维码，添加企业微信</div>
    </div>
    <a class="channel" href="mailto:support@sagemro.com">
      <div class="k">邮箱</div>
      <div class="v">support@sagemro.com</div>
    </a>
  </div>

  <p class="note">线上服务请求提交入口已暂时关闭，改为人工受理。请通过上述渠道联系我们，并说明设备类型、品牌型号与所在地区，便于我们快速响应。</p>

  <footer>
    <a href="/">返回首页</a>
    <span>·</span>
    <a href="https://sagemro.com/">International site</a>
  </footer>
</main>
</body>
</html>
